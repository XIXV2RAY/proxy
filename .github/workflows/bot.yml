name: Telegram Bot

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "*/10 * * * *"  # هر 10 دقیقه برای زنده نگه داشتن

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps
        run: pip install python-telegram-bot==20.0

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
