name: proxy-bot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install python-telegram-bot==20.0 requests

      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

      # ذخیره non-repeat واقعی
      - name: Save used proxies
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add used_proxies.txt
          git commit -m "update used proxies" || echo "no changes"
          git push
