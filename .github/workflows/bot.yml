name: Proxy Bot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install python-telegram-bot==20.0 requests

      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SUB_URL: ${{ secrets.SUB_URL }}

      - name: Commit logs
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add log.txt index.txt proxies.txt || true
          git commit -m "update logs" || exit 0
          git push
